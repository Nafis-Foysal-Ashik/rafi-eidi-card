  <style>
    /* --- Background & Atmospheric Animations --- */
    @keyframes starTwinkle {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    /* --- Infinite Walking Cycle --- */
    @keyframes walkingLeg {
      0%, 100% { transform: rotate(20deg); }
      50% { transform: rotate(-20deg); }
    }

    @keyframes walkingLegAlt {
      0%, 100% { transform: rotate(-20deg); }
      50% { transform: rotate(20deg); }
    }

    @keyframes bodyBob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    @keyframes sceneScroll {
      from { transform: translateX(-1200px); }
      to { transform: translateX(1500px); }
    }

    @keyframes ropeWobble {
      0%, 100% { stroke-dashoffset: 0; transform: scaleY(1); }
      50% { stroke-dashoffset: 5; transform: scaleY(1.02); }
    }

    .star { animation: starTwinkle 2s ease-in-out infinite; }
    .leg-main { animation: walkingLeg 0.6s ease-in-out infinite; }
    .leg-alt { animation: walkingLegAlt 0.6s ease-in-out infinite; }
    .body-bob { animation: bodyBob 0.6s ease-in-out infinite; }
    .cow-hero-walk { animation: sceneScroll 12s linear infinite; }
    .cow-text { fill: #1A1A1A; font-family: 'Outfit', sans-serif; font-weight: 900; }

    /* --- New Premium Additions --- */
    .scene-bg-gradient {
      background: linear-gradient(180deg, #7DD3FC 0%, #B9E6FE 60%, #F0F9FF 100%);
      background-size: 100% 100%;
    }

    .glass {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    .glow-blob {
      position: fixed;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      filter: blur(80px);
      z-index: -1;
      opacity: 0.15;
      animation: float 20s infinite alternate;
    }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(100px, 100px) scale(1.1); }
    }

    .sparkle-point {
      position: fixed;
      width: 20px;
      height: 20px;
      background: #FFD700;
      clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
      pointer-events: none;
      z-index: 9999;
      animation: sparklePop 0.8s ease-out forwards;
    }

    @keyframes sparklePop {
      0% { transform: scale(0) translate(0, 0) rotate(0deg); opacity: 1; }
      100% { transform: scale(1.5) translate(var(--move-x), var(--move-y)) rotate(180deg); opacity: 0; }
    }

    #canvasSection {
      transition: box-shadow 0.15s ease-out;
    }
  </style>

  <!-- --- Simple Vanilla JavaScript for Replaying --- -->
  <script>
    const replayBtn = document.getElementById('replayBtn');
    replayBtn.addEventListener('click', () => {
      const section = document.getElementById('canvasSection');
      const newSection = section.cloneNode(true);
      section.parentNode.replaceChild(newSection, section);
      
      // Re-initialize tilt effect after cloning
      initTilt();
    });

    // --- Interactive 3D Tilt Effect ---
    function initTilt() {
      const canvas = document.getElementById('canvasSection');
      canvas.addEventListener('mousemove', (e) => {
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const centerX = rect.width / 2;
        const centerY = rect.height / 2;
        const rotateX = (centerY - y) / 15; // More responsive tilt
        const rotateY = (x - centerX) / 15; // More responsive tilt
        
        canvas.style.transform = `perspective(1200px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.03, 1.03, 1.03)`;
        canvas.style.boxShadow = `${-rotateY * 2}px ${rotateX * 2}px 50px rgba(0,0,0,0.5)`;
      });

      canvas.addEventListener('mouseleave', () => {
        canvas.style.transform = `perspective(1200px) rotateX(0deg) rotateY(0deg) scale(1)`;
        canvas.style.boxShadow = `0 25px 50px -12px rgba(0, 0, 0, 0.8)`;
      });
    }

    // --- Click Sparkle Effect ---
    document.addEventListener('click', (e) => {
      for (let i = 0; i < 8; i++) {
        createSparkle(e.clientX, e.clientY);
      }
    });

    function createSparkle(x, y) {
      const sparkle = document.createElement('div');
      sparkle.className = 'sparkle-point';
      
      const angle = Math.random() * Math.PI * 2;
      const distance = Math.random() * 60 + 20;
      const moveX = Math.cos(angle) * distance;
      const moveY = Math.sin(angle) * distance;
      
      sparkle.style.left = x + 'px';
      sparkle.style.top = y + 'px';
      sparkle.style.setProperty('--move-x', `${moveX}px`);
      sparkle.style.setProperty('--move-y', `${moveY}px`);
      
      document.body.appendChild(sparkle);

      setTimeout(() => sparkle.remove(), 800);
    }

    // Initialize on load
    // initTilt removed as per request
  </script>
